<title>Jarvis-Gehirn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: ein schwarzer Sternenhimmel als Bühne (Galaxien = Themen), Begrüßung oben links darübergelegt,
   Bedienleiste unten; darunter ruhig das Agenten-Hochhaus. Bewusst ein einziger dunkler Look. */
:root {
  color-scheme: dark;
  --schwarz: #000000;
  --glas: rgba(14, 16, 24, 0.62);
  --glas-rand: rgba(255, 255, 255, 0.09);
  --text: #f2f3f7;
  --leise: #8a8f9e;
  --sehr-leise: #555a68;
  --licht: #ffd27a;
  --f-gruss: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-text: "Inter", system-ui, -apple-system, sans-serif;
  --f-daten: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--schwarz); color: var(--text); }
body { font-family: var(--f-text); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-weight: 500; text-wrap: balance; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 1.5px solid rgba(255,255,255,0.7); outline-offset: 2px; }
kbd { font-family: var(--f-daten); font-size: 10.5px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--glas-rand); background: rgba(255,255,255,0.06); color: var(--text); }

/* ---------- Kosmos ---------- */
.kosmos { position: relative; height: min(100svh, 980px); min-height: 600px; overflow: hidden; background: radial-gradient(ellipse at 55% 50%, #070912 0%, #000 70%); touch-action: none; }
#himmel { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#himmel:active { cursor: grabbing; }
.ui { transition: opacity 0.5s ease; }
.kosmos.clean .ui { opacity: 0; pointer-events: none; }
.kosmos.clean .leiste { opacity: 0.35; }
.kosmos.clean .leiste:hover { opacity: 1; }

.gruss { position: absolute; top: max(28px, env(safe-area-inset-top, 0px)); left: max(28px, env(safe-area-inset-left, 0px)); right: 28px; max-width: 560px; display: grid; gap: 10px; pointer-events: none; }
.gruss > * { pointer-events: auto; }
.datum { font-size: 12.5px; color: var(--leise); letter-spacing: 0.02em; }
#gruss { font-family: var(--f-gruss); font-weight: 400; font-size: clamp(40px, 6.2vw, 72px); line-height: 1.02; letter-spacing: -0.01em; }
#gruss em { font-style: italic; }
.statline { font-size: 13px; color: var(--leise); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.statline b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.capture { display: flex; align-items: center; gap: 10px; margin-top: 6px; padding: 9px 10px 9px 14px; border-radius: 12px; background: var(--glas); border: 1px solid var(--glas-rand); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); max-width: 520px; }
.capture span { color: var(--licht); }
.capture input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; font-size: 14px; }
.capture input::placeholder { color: var(--leise); }
.capture button { border: 1px solid var(--glas-rand); background: rgba(255,255,255,0.08); border-radius: 8px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.capture button:hover { background: rgba(255,255,255,0.16); }
.capture.aus { opacity: 0.55; }
.wartet { font-size: 12.5px; color: var(--leise); display: grid; gap: 3px; max-width: 520px; }
.wartet .gedanke { color: var(--text); opacity: 0.8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.karte { position: absolute; top: max(24px, env(safe-area-inset-top, 0px)); right: max(24px, env(safe-area-inset-right, 0px)); width: min(360px, calc(100% - 48px)); max-height: calc(100% - 120px); overflow-y: auto;
  padding: 18px; border-radius: 16px; background: var(--glas); border: 1px solid var(--glas-rand); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); display: grid; gap: 10px; }
.karte .kopf { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.karte .art { font-family: var(--f-daten); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--leise); display: flex; align-items: center; gap: 8px; }
.karte h3 { font-family: var(--f-gruss); font-size: 28px; line-height: 1.1; font-weight: 400; }
.karte .text { font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; color: #d9dbe3; }
.karte .quelle { font-family: var(--f-daten); font-size: 11px; color: var(--sehr-leise); overflow-wrap: anywhere; }
.karte .zu { border: 0; background: transparent; color: var(--leise); cursor: pointer; font-size: 20px; line-height: 1; padding: 2px 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; border: 1px solid var(--glas-rand); background: rgba(255,255,255,0.05); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.chip:hover { background: rgba(255,255,255,0.12); }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.punkt { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; box-shadow: 0 0 8px currentColor; }
.liste { display: grid; gap: 2px; }
.liste button { text-align: left; border: 0; background: transparent; padding: 6px 4px; border-radius: 6px; font-size: 13px; color: #d9dbe3; cursor: pointer; }
.liste button:hover { background: rgba(255,255,255,0.07); }

.leiste { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(22px, env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: center;
  padding: 6px; border-radius: 14px; background: var(--glas); border: 1px solid var(--glas-rand); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); max-width: calc(100% - 32px); transition: opacity 0.5s ease; }
.leiste .tipp { font-size: 12px; color: var(--leise); padding: 0 10px; }
.leiste button { display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; border-radius: 9px; padding: 6px 10px; font-size: 12.5px; cursor: pointer; color: #d9dbe3; }
.leiste button:hover, .leiste button[aria-pressed="true"] { background: rgba(255,255,255,0.1); color: var(--text); }
.leiste input { width: 170px; background: rgba(255,255,255,0.06); border: 1px solid var(--glas-rand); border-radius: 8px; padding: 5px 10px; font-size: 13px; outline: none; }
@media (max-width: 640px) { .leiste .tipp { display: none; } .gruss { left: 18px; right: 18px; top: max(20px, env(safe-area-inset-top, 0px)); } }
@media (hover: none), (max-width: 640px) { .leiste kbd { display: none; } }

.zeitleiste { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(max(22px, env(safe-area-inset-bottom, 0px)) + 58px); width: min(460px, calc(100% - 32px));
  display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-radius: 12px; background: var(--glas); border: 1px solid var(--glas-rand); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.zeitleiste span { font-family: var(--f-daten); font-size: 12px; white-space: nowrap; min-width: 92px; }
.zeitleiste input { flex: 1; accent-color: #fff; }
.zaehler { position: absolute; right: max(24px, env(safe-area-inset-right, 0px)); bottom: max(28px, env(safe-area-inset-bottom, 0px)); font-family: var(--f-daten); font-size: 11px; color: var(--sehr-leise); text-align: right; }
@media (max-width: 1100px) { .zaehler { display: none; } }

/* ---------- Umschalter Gehirn | Agenten ---------- */
.tabs { position: fixed; z-index: 20; top: max(14px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 2px; padding: 4px; border-radius: 12px;
  background: var(--glas); border: 1px solid var(--glas-rand); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.tabs a { text-decoration: none; color: #c9ccd6; font-size: 13.5px; padding: 7px 14px; border-radius: 9px; display: inline-flex; align-items: center; gap: 8px; }
.tabs a[aria-current="page"] { background: rgba(255,255,255,0.13); color: var(--text); }
.tabs .live-punkt { width: 7px; height: 7px; border-radius: 50%; background: #5df2a0; box-shadow: 0 0 8px #5df2a0; display: none; }
.tabs .live-punkt.an { display: inline-block; animation: blink 1.6s infinite; }
.karte { top: calc(max(24px, env(safe-area-inset-top, 0px)) + 52px); }

/* ---------- Agenten-Zentrale ---------- */
.unten { min-height: 100svh; padding-block: 88px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--schwarz); }
.unten-innen { max-width: 1180px; margin: 0 auto; display: grid; gap: 28px; }
.ueberschrift { display: grid; gap: 6px; }
.ueberschrift .etikett { font-family: var(--f-daten); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--leise); }
.ueberschrift h2 { font-family: var(--f-gruss); font-weight: 400; font-size: clamp(32px, 4vw, 46px); line-height: 1.05; }
.zentrale { display: grid; grid-template-columns: minmax(0, 500px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 920px) { .zentrale { grid-template-columns: minmax(0, 1fr); } }
.haus { display: grid; justify-items: center; }
.dach { width: 74%; display: grid; justify-items: center; }
.antenne { width: 2px; height: 30px; background: #2a2d38; position: relative; }
.antenne::before { content: ""; position: absolute; top: -5px; left: -4px; width: 10px; height: 10px; border-radius: 50%; background: #ff5d6c; box-shadow: 0 0 14px #ff5d6c; animation: blink 2.4s infinite; }
@keyframes blink { 0%, 60%, 100% { opacity: 1; } 70%, 90% { opacity: 0.15; } }
.schild { width: 100%; text-align: center; padding: 8px 0; border: 1px solid #1d2029; border-bottom: none; border-radius: 10px 10px 0 0; background: #07080c;
  font-family: var(--f-daten); font-size: 13px; letter-spacing: 0.5em; color: var(--text); }
.fassade { width: 100%; border: 1px solid #1d2029; border-radius: 4px 4px 0 0; background: #050608; padding: 12px; display: grid; gap: 10px; }
.etage { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 14px; align-items: center; padding: 8px; border: 1px solid #15171f; border-radius: 10px; background: #0a0b10; }
@media (max-width: 420px) { .etage { grid-template-columns: 108px minmax(0, 1fr); } }
.fenster { aspect-ratio: 3 / 2; max-width: 100%; border-radius: 6px; background: #06070b; border: 1px solid #1d2029; overflow: hidden; }
.etage.an .fenster { background: linear-gradient(180deg, rgba(255,210,122,0.22), rgba(255,210,122,0.06)); border-color: rgba(255,210,122,0.35); box-shadow: 0 0 26px rgba(255,210,122,0.16); }
.fenster svg { width: 100%; height: 100%; display: block; }
.info { display: grid; gap: 3px; min-width: 0; }
.zeile1 { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.zeile1 h3 { font-size: 15px; font-weight: 600; }
.status { font-family: var(--f-daten); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; padding: 1px 7px; border-radius: 999px; border: 1px solid #23262f; color: var(--leise); }
.etage.an .status { color: var(--licht); border-color: rgba(255,210,122,0.45); }
.rolle { font-size: 12.5px; color: var(--leise); }
.job { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #d9dbe3; }
.job time { font-family: var(--f-daten); font-size: 11.5px; color: var(--leise); }
.boden { width: 100%; height: 6px; border-radius: 3px; background: #15171f; }
.arm { transform-origin: 62px 62px; }
.etage.an .arm { animation: tippen 0.5s ease-in-out infinite alternate; }
.etage.an .zeilen { animation: laufen 1.6s linear infinite; }
@keyframes tippen { from { transform: rotate(-6deg); } to { transform: rotate(8deg); } }
@keyframes laufen { from { transform: translateY(0); } to { transform: translateY(-12px); } }
.protokoll { display: grid; gap: 4px; min-width: 0; }
.protokoll ol { list-style: none; margin: 0; padding: 0; }
.protokoll li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 12px; padding: 12px 0; border-top: 1px solid #15171f; align-items: start; }
.protokoll li:first-child { border-top: none; }
.protokoll li .punkt { margin-top: 7px; }
.protokoll .was { font-size: 14px; overflow-wrap: anywhere; }
.protokoll .wer { font-size: 12.5px; color: var(--leise); }
.protokoll .dateien { font-family: var(--f-daten); font-size: 11px; color: var(--sehr-leise); overflow-wrap: anywhere; }
.protokoll time { font-family: var(--f-daten); font-size: 11.5px; color: var(--leise); white-space: nowrap; }
.fuss { font-size: 12px; color: var(--sehr-leise); }
.ag-zeile { color: var(--leise); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.ag-zeile b { color: var(--text); font-weight: 600; }
.etagen-titel { font-family: var(--f-daten); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--leise); padding: 4px 4px 0; }
.etage.wartet .fenster { border-color: rgba(255,179,92,0.5); box-shadow: 0 0 22px rgba(255,179,92,0.18); background: linear-gradient(180deg, rgba(255,179,92,0.18), rgba(255,179,92,0.04)); }
.etage.wartet .status { color: #ffb35c; border-color: rgba(255,179,92,0.5); }
.etage.fehler .status { color: #ff6b6b; border-color: rgba(255,107,107,0.5); }
.etage .hinweis { font-size: 12.5px; color: #ffb35c; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.haus-box { display: grid; gap: 10px; min-width: 0; }
#haus { width: 100%; display: block; border-radius: 12px; background: #030305; touch-action: manipulation; cursor: pointer; }
.figur-info { min-height: 64px; padding: 12px 14px; border: 1px solid #15171f; border-radius: 12px; background: #07080c; font-size: 13.5px; color: #d9dbe3; display: grid; gap: 3px; }
.figur-info b { font-size: 15px; color: var(--text); }
.figur-info .klein { color: var(--leise); font-size: 12.5px; }
.figur-info .du { color: #ffb35c; }
/* ---------- Radar ---------- */
.radar { position: relative; height: 100svh; min-height: 560px; overflow: hidden; background: #000; }
#radar-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
.radar-kopf { position: absolute; top: max(24px, env(safe-area-inset-top, 0px)); left: max(24px, env(safe-area-inset-left, 0px)); right: 220px; display: grid; gap: 8px; pointer-events: none; }
.radar-kopf > * { pointer-events: auto; }
.radar-kopf .etikett { font-family: var(--f-daten); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #4fe3ff; }
.radar-kopf h2 { font-family: var(--f-gruss); font-weight: 400; font-size: clamp(34px, 5vw, 56px); line-height: 1; }
.radar-zeile { font-size: 13px; color: var(--leise); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.radar-zeile b { color: var(--text); }
.filter { display: flex; flex-wrap: wrap; gap: 6px; max-width: 560px; }
.filter button { border: 1px solid var(--glas-rand); background: rgba(255,255,255,0.05); border-radius: 999px; padding: 3px 11px; font-size: 12px; cursor: pointer; color: #d9dbe3; }
.filter button[aria-pressed="true"] { background: rgba(79,227,255,0.16); border-color: rgba(79,227,255,0.5); color: var(--text); }
.radar-leer { position: absolute; left: 50%; bottom: max(90px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(520px, calc(100% - 32px)); text-align: center; font-size: 13.5px; color: var(--leise);
  padding: 12px 16px; border-radius: 12px; background: var(--glas); border: 1px solid var(--glas-rand); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.radar-leer b { color: var(--text); font-weight: 500; }
.radar-knopf { position: absolute; right: max(24px, env(safe-area-inset-right, 0px)); bottom: max(24px, env(safe-area-inset-bottom, 0px)); border: 1px solid var(--glas-rand); background: var(--glas); border-radius: 10px; padding: 8px 14px; font-size: 13px; cursor: pointer; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.betrieb-karte { position: absolute; right: max(24px, env(safe-area-inset-right, 0px)); top: calc(max(24px, env(safe-area-inset-top, 0px)) + 52px); width: min(340px, calc(100% - 48px)); padding: 16px; border-radius: 14px;
  background: var(--glas); border: 1px solid var(--glas-rand); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: grid; gap: 8px; font-size: 13.5px; }
.betrieb-karte h3 { font-family: var(--f-gruss); font-size: 26px; font-weight: 400; line-height: 1.1; }
.betrieb-karte .klein { color: var(--leise); font-size: 12.5px; overflow-wrap: anywhere; }
.betrieb-karte select { background: #0b0c12; border: 1px solid var(--glas-rand); border-radius: 8px; padding: 5px 8px; color: var(--text); font: inherit; font-size: 13px; }
@media (max-width: 640px) { .radar-kopf { right: 24px; top: calc(max(24px, env(safe-area-inset-top, 0px)) + 48px); } }
.live-box { display: grid; gap: 10px; padding: 16px; border: 1px solid #15171f; border-radius: 12px; background: #07080c; }
.live-box p { margin: 0; color: var(--leise); font-size: 13.5px; }
.live-box button { justify-self: start; border: 1px solid var(--glas-rand); background: rgba(255,255,255,0.08); border-radius: 9px; padding: 7px 14px; font-size: 13.5px; cursor: pointer; }
.live-box button:hover { background: rgba(255,255,255,0.15); }
.protokoll h3 { font-size: 13px; font-family: var(--f-daten); letter-spacing: 0.14em; text-transform: uppercase; color: var(--leise); font-weight: 500; padding-top: 10px; }
.leer { color: var(--leise); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .antenne::before, .etage.an .arm, .etage.an .zeilen { animation: none; } }
</style>

<nav class="tabs" aria-label="Ansicht wählen">
  <a href="#gehirn" id="tab-gehirn" aria-current="page">Gehirn</a>
  <a href="#agenten" id="tab-agenten"><i class="live-punkt" id="tab-live"></i>Agenten</a>
  <a href="#radar" id="tab-radar">Radar</a>
</nav>

<section class="kosmos" id="kosmos" aria-label="Gehirn als Sternenkarte">
  <canvas id="himmel" aria-label="Drehbare Sternenkarte: jede Galaxie ist ein Thema, jeder Stern ein Eintrag"></canvas>

  <header class="gruss ui">
    <div class="datum" id="datum"></div>
    <h1 id="gruss">Guten Tag.</h1>
    <div class="statline" id="statline"></div>
    <form class="capture aus" id="capture" autocomplete="off">
      <span aria-hidden="true">✦</span>
      <input id="gedanke" type="text" maxlength="600" placeholder="Gedanken festhalten – Claude holt ihn ins Gehirn" aria-label="Gedanken festhalten">
      <button type="submit">Merken</button>
    </form>
    <div class="wartet" id="wartet"></div>
  </header>

  <aside class="karte ui" id="karte" hidden aria-live="polite"></aside>

  <div class="zeitleiste ui" id="zeitleiste" hidden>
    <span id="zeit-datum"></span>
    <input id="zeit" type="range" min="0" max="100" value="100" aria-label="Zeitleiste: wie das Gehirn gewachsen ist">
  </div>

  <nav class="leiste" id="leiste" aria-label="Ansicht steuern">
    <button type="button" id="b-morph" aria-pressed="false"><kbd>Leertaste</kbd>Gehirn</button>
    <button type="button" id="b-wachsen" aria-pressed="false"><kbd>W</kbd>Wachsen</button>
    <button type="button" id="b-namen" aria-pressed="true"><kbd>N</kbd>Namen</button>
    <button type="button" id="b-clean" aria-pressed="false"><kbd>C</kbd>Clean View</button>
    <button type="button" id="b-suche" aria-pressed="false"><kbd>/</kbd>Suche</button>
    <input id="suche" type="search" placeholder="z. B. Hook, NEXORA" hidden aria-label="Im Gehirn suchen">
  </nav>
  <div class="zaehler ui" id="zaehler"></div>
</section>

<section class="radar" id="radar-ansicht" aria-label="Website-Radar" hidden>
  <canvas id="radar-cv" aria-label="Weltkugel zoomt auf Solingen, dann Radar mit Betrieben ohne Website"></canvas>
  <div class="radar-kopf">
    <span class="etikett">Website-Radar · NEXORA</span>
    <h2>Solingen</h2>
    <div class="radar-zeile" id="radar-zeile"></div>
    <div class="filter" id="radar-filter"></div>
  </div>
  <div class="radar-leer" id="radar-leer" hidden></div>
  <aside class="betrieb-karte" id="betrieb-karte" hidden aria-live="polite"></aside>
  <button class="radar-knopf" type="button" id="radar-neu">Neu scannen</button>
</section>

<section class="unten" id="agenten-ansicht" aria-label="Agenten-Zentrale" hidden>
  <div class="unten-innen">
    <div class="ueberschrift"><span class="etikett">Agenten-Zentrale · live</span><h2>Wer gerade arbeitet</h2><div class="ag-zeile" id="ag-zeile"></div></div>
    <div class="zentrale">
      <div class="haus-box">
        <canvas id="haus" aria-label="Hochhaus: jede Figur ist ein Agent, sitzt am Schreibtisch, wenn er arbeitet"></canvas>
        <div class="figur-info" id="figur-info">Tippe eine Figur an.</div>

label": "Projekte", "art": "datei", "bereich": "fakten", "quelle": "gehirn/fakten/projekte.md", "galaxie": "fakten:projekte", "galaxie_name": "Projekte", "datum": "2026-11-18"}, {"id": "gehirn/fakten/projekte.md:3", "label": "Jarvis-Wissensnetz: Graphify baut auf dem PC aus dem Ordner…", "art": "eintrag", "bereich": "fakten", "quelle": "gehirn/fakten/projekte.md:3", "text": "2026-11-18 · Jarvis-Wissensnetz: Graphify baut auf dem PC aus dem Ordner JarvisWissen ein Wissensnetz, das Jarvis abfragt (Ordner jarvis-wissensnetz). · Quelle: Repo Visual-Netz-", "datum": "2026-11-18", "galaxie": "fakten:projekte"}, {"id": "gehirn/fakten/projekte.md:4", "label": "Second Brain: Jarvis' Gehirn liegt zusätzlich im Repo (Ordn…", "art": "eintrag", "bereich": "fakten", "quelle": "gehirn/fakten/projekte.md:4", "text": "2026-11-18 · Second Brain: Jarvis' Gehirn liegt zusätzlich im Repo (Ordner gehirn), damit Claude vom iPad aus immer darauf zugreifen kann; der PC gleicht es automatisch ab. · Quelle: Gespräch iPad", "datum": "2026-11-18", "galaxie": "fakten:projekte"}, {"id": "gehirn/fakten/projekte.md:5", "label": "Edge Lab Replay ist seit 23.11.2026 live im Apple-Look: hel…", "art": "eintrag", "bereich": "fakten", "quelle": "gehirn/fakten/projekte.md:5", "text": "2026-11-23 · Edge Lab Replay ist seit 23.11.2026 live im Apple-Look: heller Glas-Modus als Standard, Hell/Dunkel-Schalter (Sonne/Mond oben rechts), Dashboard als Startseite, Universum nur noch als Tab. · Quelle: Gespräch iPad 23.11.2026, Commit bf67f44", "datum": "2026-11-23", "galaxie": "fakten:projekte"}, {"id": "gehirn/fakten/projekte.md:6", "label": "Edge Lab Replay hat seit 23.11.2026 Journal+ (Tage, Kalende…", "art": "eintrag", "bereich": "fakten", "quelle": "gehirn/fakten/projekte.md:6", "text": "2026-11-23 · Edge Lab Replay hat seit 23.11.2026 Journal+ (Tage, Kalender, Tagebuch, Gefühle/Fehler-Merkmale, Sterne-Bewertung), eine Heute-Karte mit Börsenzeiten und Terminen sowie KI-Auswertung durch Jarvis (tägliches Insight, Wochenrückblick, Plan prüfen/Tag auswerten). · Quelle: Gespräch iPad 23.11.2026, Commit b797b8c", "datum": "2026-11-23", "galaxie": "fakten:projekte"}, {"id": "gehirn/fakten/recherche.md", "label": "Recherche-Ergebnisse", "art": "datei", "bereich": "fakten", "quelle": "gehirn/fakten/recherche.md", "galaxie": "fakten:recherche", "galaxie_name": "Recherche-Ergebnisse", "datum": "2026-11-18"}, {"id": "notizen", "label": "Notizen", "art": "bereich", "bereich": "notizen"}, {"id": "gespraeche", "label": "Gespräche", "art": "bereich", "bereich": "gespraeche"}, {"id": "gehirn/gespraeche/2026-11-18_Second_Brain_fuers_iPad_gebaut.md", "label": "Second Brain fürs iPad gebaut", "art": "datei", "bereich": "gespraeche", "quelle": "gehirn/gespraeche/2026-11-18_Second_Brain_fuers_iPad_gebaut.md", "galaxie": "gespraeche", "galaxie_name": "Gespräche", "datum": "2026-11-18", "text": "# Second Brain fürs iPad gebaut\n\nDatum: 2026-11-18  \nQuelle: Claude Code auf dem iPad\n\n- Ziel: Jarvis' Gehirn auch vom iPad aus nutzen, damit keine Infos verloren gehen, auch wenn der PC aus ist.\n- Lösung: Das Gehirn liegt im Repo-Ordner gehirn/ (fakten, notizen, gespraeche). Werkzeug: gehirn.py (uebersicht, suche, merken, notiz, gespraech).\n- CLAUDE.md sagt jeder neuen Claude-Sitzung, dass sie das Gehirn zu Beginn liest, Fakten merkt und am Ende eine Zusammenfassung ablegt.\n- PC-Seite: jarvis-wissensnetz/gehirn_sync.py gleicht gehirn/ mit JarvisWissen ab (beim Dienst-Start und alle 2 Minuten), Graphify baut daraus das Netz.\n- Offen: Auf dem PC Git installieren, Repo klonen, installieren.bat im Klon ausführen (oder gehirn_repo in config.json setzen).\n"}, {"id": "gehirn/gespraeche/2026-11-18_Website-Radar_Solingen_gefuellt.md", "label": "Website-Radar Solingen gefuellt", "art": "datei", "bereich": "gespraeche", "quelle": "gehirn/gespraeche/2026-11-18_Website-Radar_Solingen_gefuellt.md", "galaxie": "gespraeche", "galaxie_name": "Gespräche", "datum": "2026-11-18", "text": "# Website-Radar Solingen gefuellt\n\nDatum: 2026-11-18  \nQuelle: Claude auf dem iPad\n\nAuftrag: Website-Radar im Dashboard mit Solinger Betrieben ohne eigene Website füllen (Umkreis 10 km).\nErgebnis: 114 Betriebe in die Sammlung betriebe der Dashboard-Seite eingetragen, alle einzeln per Websuche geprüft (Gelbe Seiten, Telefonbuch, Das Örtliche, 11880, Google-Profil soweit sichtbar), Koordinaten gebäudegenau über OpenStreetMap.\nBranchen: Friseure 26, Elektriker 12, Fußpflege 12, Maler 12, Dachdecker 10, Kfz 10, Sanitär/Heizung 9, Bäcker 6, Fliesenleger 6, Garten 4, Kosmetik 3, Makler 2, Schreiner 1, Bodenleger 1.\nAussortiert: 48 Kandidaten hatten doch eine eigene Website (bei Maklern und Schreinern die Mehrheit, bei Friseuren und Fußpflege kaum).\nErkenntnis: Fehlender Homepage-Eintrag in Verzeichnissen beweist nichts, etwa 40 % haben trotzdem eine Domain. Stärkste Kandidaten sind Friseure/Bäcker mit vielen Google-Bewertungen, aber ohne Website.\nWerkzeuge: Gelbe Seiten/Telefonbuch-Listen über den Parallel-Abruf (Tageslimit erreicht), Einzelprüfung über Exa-Suche; Exa-Agent im Listenmodus erfindet/verallgemeinert Ergebnisse, nicht nutzen.\nOffen: ca. 47 Kandidaten ungeprüft (Gastronomie, Nagelstudios, Hausverwaltungen, Glaser, Raumausstatter, Rest Sanitär/Schreiner, Änderungsschneidereien); Ziel 200+ noch nicht erreicht.\nDie Betriebsliste liegt nur in der Datenbank der Dashboard-Seite, nicht im Repo.\n"}, {"id": "gehirn/gespraeche/2026-11-23_Backtesting-App_im_Apple-Look.md", "label": "Backtesting-App im Apple-Look", "art": "datei", "bereich": "gespraeche", "quelle": "gehirn/gespraeche/2026-11-23_Backtesting-App_im_Apple-Look.md", "galaxie": "gespraeche", "galaxie_name": "Gespräche", "datum": "2026-11-23", "text": "# Backtesting-App im Apple-Look\n\nDatum: 2026-11-23  \nQuelle: Claude auf dem iPad\n\nEdge Lab Replay (Repo edge-lab-replay) optisch überarbeitet, nur Design, keine Funktionen geändert: neue Dateien src/apple.css und src/apple.js. Ruhiger, weichgezeichneter Hintergrund im Terminal (schwarzes Loch störte die Lesbarkeit), große einheitliche Seitentitel, Glaskarten mit 18px-Radius, macOS-artige Seitenleiste, iOS-Segmente, Hover-Effekte (Karten leuchten, Kacheln heben sich, Lichtpunkt folgt der Maus). Nebenbei Fehler im Marktüberblick behoben (Fehlermeldung auf dem Handy). Liegt als Testversion in beta/index.html auf dem Sitzungs-Branch claude/lucid-heisenberg-7jr8tf. Offen: Eliano schaut es sich zu Hause an; nach OK auf den Standard-Branch (dann /beta/) und später live auf index.html (sw.js-Cache erhöhen).\n"}, {"id": "wissen", "label": "Wissen", "art": "bereich", "bereich": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/01_hooks.md", "label": "Hooks: Die ersten 1–3 Sekunden", "art": "datei", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/01_hooks.md", "galaxie": "wissen", "galaxie_name": "Marketing-Wissen", "datum": "2026-11-09"}, {"id": "jarvis-wissensnetz/wissen/marketing/01_hooks.md#Der Job eines Hooks", "label": "Der Job eines Hooks", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/01_hooks.md", "text": "- In 1–2 Sekunden klar machen, worum es geht.\n- Neugier wecken: eine offene Frage im Kopf erzeugen, die erst das Video beantwortet (Open Loop).\n- Die richtige Zielgruppe ansprechen und die falsche ruhig wegscrollen lassen.\n- Nichts Vages wie „Das ist krass“. Konkret schlägt vage.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/01_hooks.md#Die drei Ebenen eines Video-Hooks", "label": "Die drei Ebenen eines Video-Hooks", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/01_hooks.md", "text": "Alle drei müssen dasselbe sagen:\n1. **Text-Hook** (Overlay): 3–6 Wörter, max. 2 Zeilen, oberes Drittel, ca. 3 Sekunden sichtbar, verdeckt weder Gesicht noch Produkt. Keine Füllwörter.\n2. **Visueller Hook** (erstes Bild): mitten in der Bewegung starten, nie mit Standbild oder Logo. Bewegung, Kontrast, ein unerwartetes Bild.\n3. **Audio-Hook**: Sound oder gesprochener erster Satz ab Sekunde 0. Kein Einatmen, kein „Hey Leute“.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/01_hooks.md#Hook-Typen mit Formel", "label": "Hook-Typen mit Formel", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/01_hooks.md", "text": "| Typ | Formel | Beispiel |\n|---|---|---|\n| Kontrast / Mythos | „Alle sagen X, aber Y“ | „Ich dachte Compression ist Marketing“ |\n| Konkreter Nutzen | Ergebnis + Zeit/Zahl | „3 Hooks die meine Views verdoppelt haben“ |\n| POV / Relatable | „POV: du …“ | „POV du trägst zum ersten Mal Compression“ |\n| Wenn-Hook (Problem) | „Wenn dein … dann …“ | „Wenn dein Shirt beim Klimmzug hochrutscht“ |\n| Fehler / Warnung | „Hör auf X zu machen“ | „Hör auf so deine Hooks zu schreiben“ |\n| Story / Gründer | Startpunkt + Spannung | „Student mit eigener Gym-Brand: Tag 1“ |\n| Liste | Zahl + Versprechen | „5 Fehler die dein Reel killen“ |\n| Frage | Frage, die die Zielgruppe sich selbst stellt | „Warum hat dein Reel 200 Views?“ |\n| Ergebnis zuerst | Vorher/Nachher zeigen, dann erklären | Transformation in Sekunde 1 |\n| Saison / Trend | Aktuelles Ereignis + Thema | „WinterArc Kompression“ |\n| Neugier-Lücke | Etwas andeuten, nicht verraten | „Das hat mir niemand über Reels gesagt“ |", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/01_hooks.md#Regeln", "label": "Regeln", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/01_hooks.md", "text": "- „Du/dein“ statt „ich/mein“: der Zuschauer muss sich gemeint fühlen.\n- Zahlen, Zeiträume und konkrete Dinge erhöhen die Glaubwürdigkeit.\n- Power-Wörter: POV, Fehler, niemand, geheim, hör auf, scam, hate, endlich, wirklich.\n- Direkt nach dem Hook das Versprechen einlösen. Ein Hook, der lügt (Clickbait ohne Auszahlung), senkt Watchtime und Vertrauen.\n- Pro Video mehrere Hook-Varianten testen; gleicher Inhalt, anderer Hook, ist der billigste Test.\n- Das Video als Loop denken: das Ende führt wieder an den Anfang, das erhöht die Wiedergaben.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/01_hooks.md#Bewährte Formate für Faith_Aesthetic (eigene Marke)", "label": "Bewährte Formate für Faith_Aesthetic (eigene Mark…", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/01_hooks.md", "text": "Stil: dunkler Look mit Rot-Akzent, schnelle Cuts auf den Beat, wenig Text (nur der Hook-Text), ein Sound pro Reel.\n1. Mitten in der Pose + 2-Wort-Text („Holy Compression“)\n2. Nutzen-Text („Arme betont, Bauch versteckt“)\n3. POV / Relatable („POV du trägst zum ersten Mal Compression“)\n4. Gründer-Story („Student mit eigener Gym-Brand: Tag 1“), nur wenn wahr\n5. Saison („WinterArc Kompression“)\n6. Wenn-Hook („Wenn dein Shirt beim Klimmzug hochrutscht“)\n7. Scam/Kontrast („Ich dachte Compression ist Marketing“)\nPro Reel 3 Varianten (Text + erstes Bild + Sound) und eine empfehlen. Keine Produktversprechen erfinden.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/01_hooks.md#Hooks außerhalb von Video", "label": "Hooks außerhalb von Video", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/01_hooks.md", "text": "- **Betreffzeile E-Mail**: kurz, konkret, Neugier oder Nutzen; Vorschautext als zweiter Hook.\n- **Anzeigen**: die erste Zeile des Primärtexts und das erste Bild sind der Hook.\n- **Karussell**: Folie 1 ist der Hook, Folie 2 muss sofort liefern.\n- **Landingpage**: die Überschrift ist der Hook, sie sagt Ergebnis für wen.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md", "label": "Copywriting-Frameworks", "art": "datei", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md", "galaxie": "wissen", "galaxie_name": "Marketing-Wissen", "datum": "2026-11-09"}, {"id": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md#AIDA", "label": "AIDA", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md", "text": "Attention → Interest → Desire → Action. Aufmerksamkeit holen, Interesse mit Details, Verlangen mit Nutzen und Beweis, dann klarer Call-to-Action. Klassiker für Anzeigen und Landingpages.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md#PAS", "label": "PAS", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md", "text": "Problem → Agitate → Solution. Problem benennen, Schmerz verstärken („was es dich kostet“), Lösung zeigen. Stark für Anzeigen und kurze Videos.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md#BAB", "label": "BAB", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md", "text": "Before → After → Bridge. Situation vorher, Situation nachher, das Produkt ist die Brücke. Gut für Vorher/Nachher-Inhalte.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md#4 U (für Überschriften und Hooks)", "label": "4 U (für Überschriften und Hooks)", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md", "text": "Useful (nützlich), Urgent (dringend), Unique (einzigartig), Ultra-specific (sehr konkret). Je mehr davon, desto stärker.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md#Features → Vorteile → Gefühl", "label": "Features → Vorteile → Gefühl", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md", "text": "Feature: „Kompressionsstoff“. Vorteil: „sitzt eng, rutscht nicht“. Gefühl: „du siehst im Gym breiter aus“. Menschen kaufen das Gefühl, begründen mit dem Feature.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md#Storytelling-Struktur für Kurzvideos", "label": "Storytelling-Struktur für Kurzvideos", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md", "text": "Hook → Kontext (wer, wo) → Konflikt/Problem → Wendepunkt → Ergebnis → CTA. Spannung entsteht durch eine offene Frage, die erst am Ende beantwortet wird.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md#Call-to-Action (CTA)", "label": "Call-to-Action (CTA)", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md", "text": "- Ein Video, ein CTA. Mehrere CTAs senken die Handlung.\n- Konkret: „Speicher dir das für dein nächstes Reel“ statt „Lass ein Like da“.\n- Speichern und Teilen sind auf Instagram stärkere Signale als Likes.\n- Kommentar-CTAs mit Stichwort („Schreib HOOK und ich schick dir die Liste“) erzeugen Kommentare und DMs.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md#Sozialer Beweis", "label": "Sozialer Beweis", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md", "text": "Zahlen, Bewertungen, Kundenstimmen, Vorher/Nachher, „verkauft an 1.000 Leute“. Beweis direkt nach dem Versprechen platzieren.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md#Einwände vorwegnehmen", "label": "Einwände vorwegnehmen", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/02_copywriting_frameworks.md", "text": "Die 3 häufigsten Gründe, nicht zu kaufen (zu teuer, funktioniert bei mir nicht, keine Zeit), im Inhalt beantworten, bevor sie gedacht werden.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/03_kurzvideo_strategie.md", "label": "Kurzvideo-Strategie (Reels, TikTok, Shorts)", "art": "datei", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/03_kurzvideo_strategie.md", "galaxie": "wissen", "galaxie_name": "Marketing-Wissen", "datum": "2026-11-09"}, {"id": "jarvis-wissensnetz/wissen/marketing/03_kurzvideo_strategie.md#Was die Algorithmen belohnen", "label": "Was die Algorithmen belohnen", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/03_kurzvideo_strategie.md", "text": "- **Watchtime und Durchschauquote**: Wie viel vom Video gesehen wird, und ob es mehrfach gesehen wird (Loops).\n- **Halterate nach 3 Sekunden**: Entscheidet, ob das Video weiter ausgespielt wird.\n- **Teilen und Speichern**: Instagram gewichtet Teilen (vor allem per DM) besonders stark für Reichweite an Nicht-Follower.\n- **Kommentare**: Gespräche unter dem Video signalisieren Relevanz.\n- Videos werden zuerst einer kleinen Testgruppe gezeigt; gute Werte dort öffnen die nächste, größere Gruppe.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/03_kurzvideo_strategie.md#Aufbau eines Reels", "label": "Aufbau eines Reels", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/03_kurzvideo_strategie.md", "text": "1. Hook (0–3 s): Text + erstes Bild + Sound passen zusammen.\n2. Liefern (3–15 s): Versprechen sofort einlösen, schnelle Schnitte, alle 1–3 Sekunden etwas Neues.\n3. Abschluss: Ergebnis oder Pointe, CTA, Ende führt in den Anfang (Loop).\n- Länge: so kurz wie möglich für den Inhalt. 7–15 s für Loops und Ästhetik, 30–60 s für Erklärungen.\n- Untertitel einbauen, viele schauen ohne Ton.\n- Text im sicheren Bereich halten (nicht unten rechts, wo Buttons liegen).", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/03_kurzvideo_strategie.md#Content-Säulen", "label": "Content-Säulen", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/03_kurzvideo_strategie.md", "text": "3–4 feste Themen, damit das Profil klar wirkt und der Algorithmus die Zielgruppe versteht. Beispiel Gym-Brand: Produkt in Aktion, Training/Tipps, Gründer-Story/Behind the Scenes, Community/Kunden.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/03_kurzvideo_strategie.md#Trends und Sounds", "label": "Trends und Sounds", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/03_kurzvideo_strategie.md", "text": "- Trend-Sounds früh nutzen, solange sie wachsen.\n- Trend an die eigene Marke anpassen, nicht kopieren.\n- Ein Sound pro Reel, Beat-Schnitte auf den Sound.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/03_kurzvideo_strategie.md#Outlier-Methode (Ideen finden)", "label": "Outlier-Methode (Ideen finden)", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/03_kurzvideo_strategie.md", "text": "Videos suchen, die im Verhältnis zur Followerzahl des Accounts extrem gut liefen (z. B. 10× mehr Views als üblich). Deren Hook, Format und Thema analysieren und für die eigene Nische umbauen. Outlier zeigen, was die Zielgruppe wirklich will.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/03_kurzvideo_strategie.md#Posting-Rhythmus", "label": "Posting-Rhythmus", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/03_kurzvideo_strategie.md", "text": "- Regelmäßigkeit schlägt Perfektion; lieber 4 gute Reels pro Woche dauerhaft als 14 in einer Woche.\n- Batch-Produktion: an einem Tag mehrere Videos drehen.\n- Jedes Video ist ein Test: Hook, Format, Länge variieren und messen.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/03_kurzvideo_strategie.md#Plattform-Unterschiede", "label": "Plattform-Unterschiede", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/03_kurzvideo_strategie.md", "text": "- **Instagram Reels**: Ästhetik und Teilen per DM wichtig; Karussells für Speichern.\n- **TikTok**: Unterhaltung und Authentizität, Trends schneller, Suche wird wichtiger (Keywords in Text und Caption).\n- **YouTube Shorts**: kann Abonnenten für lange Videos bringen; Titel zählt.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/04_angebot_funnel_marke.md", "label": "Angebot, Funnel und Marke", "art": "datei", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/04_angebot_funnel_marke.md", "galaxie": "wissen", "galaxie_name": "Marketing-Wissen", "datum": "2026-11-09"}, {"id": "jarvis-wissensnetz/wissen/marketing/04_angebot_funnel_marke.md#Zielgruppe zuerst", "label": "Zielgruppe zuerst", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/04_angebot_funnel_marke.md", "text": "- Eine klare Person beschreiben (Avatar): Alter, Ziel, Problem, was sie schon versucht hat, welche Worte sie selbst benutzt.\n- Die Sprache der Zielgruppe aus Kommentaren, Bewertungen und DMs übernehmen. Die besten Hooks stehen oft wörtlich in Kommentaren.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/04_angebot_funnel_marke.md#Wert eines Angebots (Value Equation, nach Alex Hormozi)", "label": "Wert eines Angebots (Value Equation, nach Alex Ho…", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/04_angebot_funnel_marke.md", "text": "Wert = (Traumergebnis × wahrgenommene Wahrscheinlichkeit) ÷ (Zeitaufwand × Mühe).\nMehr Wert entsteht, wenn das Ergebnis größer und glaubwürdiger wird oder schneller und leichter erreichbar ist. Preis ist dann zweitrangig.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/04_angebot_funnel_marke.md#Positionierung", "label": "Positionierung", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/04_angebot_funnel_marke.md", "text": "Was macht dich anders? Eine klare Aussage für eine klare Gruppe („Compression-Shirts, die beim Training sitzen und gut aussehen“) schlägt „für alle“.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/04_angebot_funnel_marke.md#Funnel (Weg vom Fremden zum Kunden)", "label": "Funnel (Weg vom Fremden zum Kunden)", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/04_angebot_funnel_marke.md", "text": "1. **Aufmerksamkeit (Top)**: Reels, TikToks, Anzeigen, Kooperationen. Ziel: Reichweite bei der richtigen Gruppe.\n2. **Vertrauen (Mitte)**: Profil, Story-Highlights, Karussells, Beweise, Gründer-Story, E-Mail-Liste.\n3. **Kauf (Unten)**: klares Angebot, Shop, Rabatt mit Frist, Retargeting-Anzeigen.\n4. **Bindung**: Danke-Mail, Community, Kunden-Content teilen, Wiederkauf.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/04_angebot_funnel_marke.md#Marke", "label": "Marke", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/04_angebot_funnel_marke.md", "text": "- Wiedererkennung durch festen Look (Farben, Schrift, Schnittstil, Sound-Stil).\n- Gründer zeigen schafft Vertrauen, gerade bei kleinen Marken.\n- Konsistenz über alle Kanäle: Profilbild, Bio, Shop und Videos erzählen dasselbe.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/04_angebot_funnel_marke.md#Verknappung und Dringlichkeit", "label": "Verknappung und Dringlichkeit", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/04_angebot_funnel_marke.md", "text": "Nur echt einsetzen (limitierte Auflage, Frist). Falsche Verknappung zerstört Vertrauen.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/04_angebot_funnel_marke.md#Kooperationen und UGC", "label": "Kooperationen und UGC", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/04_angebot_funnel_marke.md", "text": "- Kleine Creator in der Nische haben oft bessere Interaktion als große.\n- UGC (Inhalte von Kunden) wirkt glaubwürdiger als eigene Werbung und eignet sich als Anzeigenmaterial.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/05_kennzahlen_testen.md", "label": "Kennzahlen und Testen", "art": "datei", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/05_kennzahlen_testen.md", "galaxie": "wissen", "galaxie_name": "Marketing-Wissen", "datum": "2026-11-09"}, {"id": "jarvis-wissensnetz/wissen/marketing/05_kennzahlen_testen.md#Wichtige Kennzahlen bei Kurzvideos", "label": "Wichtige Kennzahlen bei Kurzvideos", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/05_kennzahlen_testen.md", "text": "| Kennzahl | Bedeutung | Woran man arbeitet |\n|---|---|---|\n| Halterate 3 s (Hook Rate) | Anteil, der nach 3 Sekunden noch schaut | Hook: Text, erstes Bild, Sound |\n| Durchschnittliche Wiedergabedauer | Wie lange im Schnitt geschaut wird | Tempo, Schnitte, Länge |\n| Durchschauquote | Anteil, der bis zum Ende schaut | Länge kürzen, Spannung bis zum Schluss |\n| Teilen, Speichern | Wert des Inhalts für andere | Nützlichkeit, Relatability |\n| Nicht-Follower-Reichweite | Wie viel neue Leute erreicht werden | Hook, Trendnähe, Teilbarkeit |\n| Profilaufrufe, Follows | Ob das Video Interesse an dir weckt | CTA, klare Profil-Story |\n| Link-Klicks, Käufe | Ob es verkauft | Angebot, Funnel |", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/05_kennzahlen_testen.md#Bei Anzeigen", "label": "Bei Anzeigen", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/05_kennzahlen_testen.md", "text": "- **CTR** (Klickrate) = Klicks ÷ Impressionen. Zeigt, ob Hook und Creative ziehen.\n- **CPC** (Kosten pro Klick), **CPM** (Kosten pro 1.000 Impressionen).\n- **Conversion Rate** = Käufe ÷ Besucher. Zeigt, ob Landingpage und Angebot funktionieren.\n- **ROAS** = Umsatz ÷ Werbeausgaben. Unter dem Break-even-ROAS (1 ÷ Marge) verliert man Geld.\n- **CAC** (Kosten pro Neukunde) muss unter dem Kundenwert (LTV) liegen.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/05_kennzahlen_testen.md#So wird getestet", "label": "So wird getestet", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/05_kennzahlen_testen.md", "text": "- Immer nur eine Sache ändern (z. B. nur den Hook), sonst weiß man nicht, was gewirkt hat.\n- Genug Daten sammeln, bevor man entscheidet; ein einzelnes Video ist Zufall, ein Muster über 5–10 Videos ist ein Signal.\n- Gewinner notieren: welcher Hook, welches Format, welche Länge, welcher Sound. Diese Erkenntnisse in `fakten/marketing-erkenntnisse.md` speichern, damit Jarvis daraus lernt.\n- Gewinner variieren statt neu erfinden.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis-wissensnetz/wissen/marketing/05_kennzahlen_testen.md#Diagnose", "label": "Diagnose", "art": "eintrag", "bereich": "wissen", "quelle": "jarvis-wissensnetz/wissen/marketing/05_kennzahlen_testen.md", "text": "- Wenig Views, gute Halterate: Thema zu klein oder Posting-Zeit schlecht.\n- Viele Views, kaum Follows: Inhalt unterhält, verbindet aber nicht mit dir oder der Marke.\n- Hohe Halterate, niedrige Durchschauquote: Hook gut, Mittelteil zu langsam.\n- Niedrige Halterate: Hook schwach oder passt nicht zum Rest.", "datum": "2026-11-09", "galaxie": "wissen"}, {"id": "jarvis", "label": "Jarvis-PC", "a
